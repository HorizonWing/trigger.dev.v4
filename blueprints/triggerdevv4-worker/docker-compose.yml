# Trigger.dev v4 Worker Stack
# Contains: supervisor, docker-proxy
# Requires: triggerdevv4 (Webapp) blueprint to be running first
# Connects to external networks: webapp, supervisor
# Shares volume: shared (for worker token exchange)

name: trigger-worker

x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-local}
  options:
    max-size: ${LOGGING_MAX_SIZE:-20m}
    max-file: ${LOGGING_MAX_FILES:-5}
    compress: ${LOGGING_COMPRESS:-true}

services:
  supervisor:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4-beta}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    depends_on:
      - docker-proxy
    networks:
      - webapp
      - supervisor
    volumes:
      - shared:/home/node/shared
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: root
    command: ./scripts/start-supervisor.sh
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3010/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      TRIGGER_API_URL: ${TRIGGER_API_URL:-http://webapp:3000}
      TRIGGER_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://webapp:3000/otel}
      DOCKER_HOST: tcp://docker-proxy:2375
      DEPLOY_REGISTRY_HOST: ${DOCKER_REGISTRY_URL:-registry:5000}
      DEPLOY_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME:-trigger-registry}
      DEPLOY_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD}
      DEPLOY_REGISTRY_NAMESPACE: ${DOCKER_REGISTRY_NAMESPACE:-trigger}
      DOCKER_RUNNER_NETWORKS: webapp,supervisor

  docker-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_IMAGE_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks:
      - supervisor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      ALLOW_RESTARTS: 1
      ALLOW_STOP: 1

volumes:
  shared:
    external: true

networks:
  webapp:
    name: webapp
    external: true
  supervisor:
    name: supervisor
    external: true
