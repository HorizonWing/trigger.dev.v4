[variables]
main_domain = "${domain}"
magic_link_secret = "${base64:16}"
session_secret = "${base64:16}"
encryption_key = "${base64:32}"
managed_worker_secret = "${base64:32}"
db_password = "${base64:24}"
clickhouse_password = "${base64:24}"
object_store_access_key = "trigger-admin"
object_store_secret_key = "${base64:24}"
minio_root_password = "${base64:24}"
docker_registry_password = "${base64:24}"

[[config.domains]]
serviceName = "webapp"
port = 3_000
host = "${main_domain}"

[config.env]
# ============================================================================
# Core
# ============================================================================
TRIGGER_IMAGE_TAG = "v4-beta"

# ============================================================================
# Image Tags (leave empty to use defaults)
# ============================================================================
POSTGRES_IMAGE_TAG = "14"
REDIS_IMAGE_TAG = "7"
CLICKHOUSE_IMAGE_TAG = ""
ELECTRIC_IMAGE_TAG = "1.2.4"
MINIO_IMAGE_TAG = ""
REGISTRY_IMAGE_TAG = "2"

# ============================================================================
# Secrets
# ============================================================================
SESSION_SECRET = "${session_secret}"
MAGIC_LINK_SECRET = "${magic_link_secret}"
ENCRYPTION_KEY = "${encryption_key}"
MANAGED_WORKER_SECRET = "${managed_worker_secret}"

# ============================================================================
# Public URLs
# ============================================================================
APP_ORIGIN = "https://${main_domain}"
LOGIN_ORIGIN = "https://${main_domain}"
API_ORIGIN = "https://${main_domain}"
DEV_OTEL_EXPORTER_OTLP_ENDPOINT = "https://${main_domain}/otel"

# ============================================================================
# Postgres
# ============================================================================
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "${db_password}"
POSTGRES_DB = "postgres"
DATABASE_URL = "postgresql://postgres:${db_password}@postgres:5432/postgres?schema=public&sslmode=disable"
DIRECT_URL = "postgresql://postgres:${db_password}@postgres:5432/postgres?schema=public&sslmode=disable"

# ============================================================================
# ClickHouse
# ============================================================================
CLICKHOUSE_USER = "trigger_admin"
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
CLICKHOUSE_URL = "http://trigger_admin:${clickhouse_password}@clickhouse:8123?secure=false"
RUN_REPLICATION_ENABLED = "1"
RUN_REPLICATION_CLICKHOUSE_URL = "http://trigger_admin:${clickhouse_password}@clickhouse:8123"
SKIP_CLICKHOUSE_MIGRATIONS = "1"

# ============================================================================
# Docker Registry (Internal)
# ============================================================================
DOCKER_REGISTRY_URL = "registry:5000"
DOCKER_REGISTRY_USERNAME = "trigger-registry"
DOCKER_REGISTRY_PASSWORD = "${docker_registry_password}"
DOCKER_REGISTRY_NAMESPACE = "trigger"

# ============================================================================
# Object Storage (MinIO - Internal)
# ============================================================================
OBJECT_STORE_ACCESS_KEY_ID = "${object_store_access_key}"
OBJECT_STORE_SECRET_ACCESS_KEY = "${object_store_secret_key}"
OBJECT_STORE_BASE_URL = "http://minio:9000"

# ============================================================================
# MinIO Console
# ============================================================================
MINIO_ROOT_USER = "${object_store_access_key}"
MINIO_ROOT_PASSWORD = "${minio_root_password}"

# ============================================================================
# Email (Resend)
# ============================================================================
EMAIL_TRANSPORT = "resend"
RESEND_API_KEY = ""
FROM_EMAIL = ""
REPLY_TO_EMAIL = ""

# ============================================================================
# Publish IPs
# ============================================================================
WEBAPP_PUBLISH_IP = "0.0.0.0"
POSTGRES_PUBLISH_IP = "127.0.0.1"
REDIS_PUBLISH_IP = "127.0.0.1"
CLICKHOUSE_PUBLISH_IP = "127.0.0.1"
REGISTRY_PUBLISH_IP = "127.0.0.1"
MINIO_PUBLISH_IP = "127.0.0.1"

# ============================================================================
# Restart & Logging
# ============================================================================
RESTART_POLICY = "unless-stopped"
LOGGING_DRIVER = "local"
LOGGING_MAX_SIZE = "20m"
LOGGING_MAX_FILES = "5"
LOGGING_COMPRESS = "true"

# ============================================================================
# Internal / Performance
# ============================================================================
INTERNAL_OTEL_TRACE_LOGGING_ENABLED = "0"
NODE_MAX_OLD_SPACE_SIZE = ""
CLICKHOUSE_LOG_LEVEL = "info"
RUN_REPLICATION_LOG_LEVEL = "info"

# ClickHouse override.xml - performance tuning for <16GB RAM systems
[[config.mounts]]
filePath = "override.xml"
content = """<clickhouse>
    <logger>
        <level>warning</level>
    </logger>
    <mark_cache_size>524288000</mark_cache_size>
    <concurrent_threads_soft_limit_num>1</concurrent_threads_soft_limit_num>
    <profiles>
        <default>
            <max_block_size>8192</max_block_size>
            <max_download_threads>1</max_download_threads>
            <input_format_parallel_parsing>0</input_format_parallel_parsing>
            <output_format_parallel_formatting>0</output_format_parallel_formatting>
        </default>
    </profiles>
</clickhouse>
"""

