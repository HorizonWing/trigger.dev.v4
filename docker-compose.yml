# Trigger.dev v4 - 单机完整部署（适合 16C16G 服务器）
# 包含：Webapp、Worker、PostgreSQL、Redis、Registry、MinIO、ClickHouse、Electric

networks:
  trigger-net:
    driver: bridge
    name: trigger-net
  docker-proxy-net:
    driver: bridge
    name: docker-proxy-net

volumes:
  postgres_data:
  redis_data:
  registry_data:
  minio_data:
  clickhouse_data:
  docker_certs:
  shared_data:

services:

  # ============================================================
  # 共享卷权限初始化（确保 node 用户可写）
  # ============================================================

  shared-init:
    image: busybox:1
    restart: "no"
    volumes:
      - shared_data:/home/node/shared
    command: chown -R 1000:1000 /home/node/shared

  minio-vol-init:
    image: busybox:1
    restart: "no"
    volumes:
      - minio_data:/data
    command: chown -R 1000:1000 /data

  clickhouse-vol-init:
    image: busybox:1
    restart: "no"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    command: chown -R 101:101 /var/lib/clickhouse

  # ============================================================
  # 基础服务
  # ============================================================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [trigger-net]
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: trigger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trigger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trigger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [trigger-net]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Electric（实时数据同步，前端 runs 列表依赖此服务）
  # ============================================================

  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    restart: unless-stopped
    networks: [trigger-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trigger:${POSTGRES_PASSWORD}@postgres:5432/trigger
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Docker Socket Proxy（安全隔离，代替直接挂载 docker.sock）
  # ============================================================

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    networks:
      - docker-proxy-net
    environment:
      LOG_LEVEL: info
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================
  # 内置镜像仓库（Registry）
  # ============================================================

  registry:
    image: registry:2
    restart: unless-stopped
    networks: [trigger-net]
    ports:
      - "5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
    volumes:
      - registry_data:/data
      - ./registry/auth.htpasswd:/auth/htpasswd:ro

  # ============================================================
  # 内置对象存储（MinIO）
  # ============================================================

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [trigger-net]
    depends_on:
      minio-vol-init:
        condition: service_completed_successfully
    ports:
      - "9002:9000"
      - "9003:9001"  # MinIO 管理界面
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    networks: [trigger-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${OBJECT_STORE_ACCESS_KEY} ${OBJECT_STORE_SECRET_KEY};
      mc mb --ignore-existing myminio/packets;
      exit 0;
      "

  # ============================================================
  # ClickHouse（日志和追踪，防止 PostgreSQL 无限增长）
  # ============================================================

  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    restart: unless-stopped
    networks: [trigger-net]
    depends_on:
      clickhouse-vol-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse123}", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # Webapp（仪表板 + API）
  # ============================================================

  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.4.4}
    restart: unless-stopped
    networks: [trigger-net]
    ports:
      - "8030:3000"
    depends_on:
      shared-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      electric:
        condition: service_healthy
    volumes:
      - shared_data:/home/node/shared
    environment:
      # 数据库
      DATABASE_URL: postgresql://trigger:${POSTGRES_PASSWORD}@postgres:5432/trigger
      DIRECT_URL: postgresql://trigger:${POSTGRES_PASSWORD}@postgres:5432/trigger
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"

      # 安全密钥（必须修改）
      SESSION_SECRET: ${SESSION_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}

      # 访问地址（改成你的域名或 IP）
      LOGIN_ORIGIN: ${APP_ORIGIN}
      APP_ORIGIN: ${APP_ORIGIN}

      # Electric（实时数据同步）
      ELECTRIC_ORIGIN: http://electric:3000

      # 内置对象存储
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY}
      OBJECT_STORE_BUCKET: packets
      OBJECT_STORE_REGION: us-east-1

      # 内置镜像仓库
      DEPLOY_REGISTRY_HOST: ${REGISTRY_HOST:-localhost:5000}
      DEPLOY_REGISTRY_NAMESPACE: ${DEPLOY_REGISTRY_NAMESPACE:-trigger}
      DEPLOY_REGISTRY_USERNAME: ${REGISTRY_USERNAME:-registry-user}
      DEPLOY_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}

      # ClickHouse 日志存储
      EVENT_REPOSITORY_DEFAULT_STORE: clickhouse_v2
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:-clickhouse123}@clickhouse:8123?secure=false
      CLICKHOUSE_LOG_LEVEL: info

      # Run Replication（将 PG run 数据复制到 ClickHouse）
      RUN_REPLICATION_ENABLED: "1"
      RUN_REPLICATION_CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:-clickhouse123}@clickhouse:8123
      RUN_REPLICATION_LOG_LEVEL: info

      # 邮件（Magic Link 登录用，不配置则魔法链接只在日志里显示）
      # 必须为 resend / smtp / aws-ses 之一，空值会导致启动失败
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      FROM_EMAIL: ${FROM_EMAIL:-}
      REPLY_TO_EMAIL: ${REPLY_TO_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # GitHub OAuth（从 .env 读取，不配置则不启用）
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}

      # Google OAuth（从 .env 读取，不配置则不启用）
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}

      # 限制注册邮箱（从 .env 读取）
      WHITELISTED_EMAILS: ${WHITELISTED_EMAILS:-}

      # 管理员邮箱（从 .env 读取）
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # 任务队列限制（从 .env 读取）
      MAXIMUM_DEPLOYED_QUEUE_SIZE: ${MAXIMUM_DEPLOYED_QUEUE_SIZE:-500000}
      MAXIMUM_DEV_QUEUE_SIZE: ${MAXIMUM_DEV_QUEUE_SIZE:-100000}

      # 锁定版本
      TRIGGER_IMAGE_TAG: ${TRIGGER_IMAGE_TAG:-v4.4.4}

      # Managed Worker Secret（需与 supervisor 匹配）
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:-managed-secret}

      # 关闭遥测
      TRIGGER_TELEMETRY_DISABLED: "1"

      # Bootstrap（首次启动自动创建 worker group 并写入 token 到共享卷）
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: default
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token

  # ============================================================
  # Worker（Supervisor，任务调度执行）
  # ============================================================

  worker:
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.4.4}
    restart: unless-stopped
    networks:
      - trigger-net
      - docker-proxy-net
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    cpus: "3"
    mem_limit: 3g
    depends_on:
      docker-proxy:
        condition: service_healthy
      webapp:
        condition: service_started
    volumes:
      - shared_data:/home/node/shared
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:-managed-secret}
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: worker
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      DEBUG: 1
      ENFORCE_MACHINE_PRESETS: 1
      TRIGGER_DEQUEUE_INTERVAL_MS: 1000
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: trigger-net
      DOCKER_REGISTRY_URL: ${REGISTRY_HOST:-}
      DOCKER_REGISTRY_USERNAME: ${REGISTRY_USERNAME:-registry-user}
      DOCKER_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: 0
      TRIGGER_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
