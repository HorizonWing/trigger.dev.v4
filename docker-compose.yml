# Trigger.dev v4 - 单机完整部署（适合 16C16G 服务器）
# 基于 triggerdotdev/trigger.dev 官方 hosting/docker 配置整合
# 包含：Webapp、Worker、PostgreSQL、Redis、Registry、MinIO、ClickHouse、Electric

x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-local}
  options:
    max-size: ${LOGGING_MAX_SIZE:-20m}
    max-file: ${LOGGING_MAX_FILES:-5}
    compress: ${LOGGING_COMPRESS:-true}

networks:
  trigger-net:
    driver: bridge
    name: trigger-net
  docker-proxy-net:
    driver: bridge
    name: docker-proxy-net

volumes:
  postgres_data:
  redis_data:
  registry_data:
  minio_data:
  clickhouse_data:
  docker_certs:
  shared_data:
  s2:
  s2-config:

services:

  # ============================================================
  # PostgreSQL（主数据库）
  # ============================================================

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trigger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trigger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trigger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Electric（实时数据同步，前端 runs 列表依赖此服务）
  # ============================================================

  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trigger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Docker Socket Proxy（安全隔离，代替直接挂载 docker.sock）
  # ============================================================

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks:
      - docker-proxy-net
    environment:
      LOG_LEVEL: info
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================
  # 内置镜像仓库（Registry）
  # ============================================================

  registry:
    image: registry:${REGISTRY_IMAGE_TAG:-2}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    ports:
      - "${REGISTRY_PUBLISH_IP:-0.0.0.0}:5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
    volumes:
      - registry_data:/data
      - ./registry/auth.htpasswd:/auth/htpasswd:ro

  # ============================================================
  # 内置对象存储（MinIO）
  # ============================================================

  minio:
    image: ghcr.io/horizonwing/minio:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    # bitnami 镜像默认以非 root 运行，挂载卷需 root 才能写入
    user: root
    ports:
      - "${MINIO_PUBLISH_IP:-0.0.0.0}:9002:9000"
      - "${MINIO_PUBLISH_IP:-0.0.0.0}:9003:9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio-init:
    image: ghcr.io/horizonwing/mc:latest
    restart: "no"
    networks: [trigger-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${OBJECT_STORE_ACCESS_KEY} ${OBJECT_STORE_SECRET_KEY};
      mc mb --ignore-existing myminio/packets;
      mc mb --ignore-existing myminio/artifacts;
      exit 0;
      "

  # ============================================================
  # ClickHouse（日志、追踪、Run Replication）
  # ============================================================

  clickhouse:
    # trigger.dev v4.7.x 的全文索引迁移（040）需要 ClickHouse >= 25.10
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-25.12-alpine}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/trigger-config.xml:/etc/clickhouse-server/config.d/trigger-config.xml:ro
      # <profiles> 属于 users.xml，必须挂到 users.d/ 才会生效（config.d 中的 profiles 段被忽略）
      - ./clickhouse/trigger-users.xml:/etc/clickhouse-server/users.d/trigger-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-default}", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse123}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Webapp（仪表板 + API）
  # ============================================================

  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.4.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks: [trigger-net]
    ports:
      - "${WEBAPP_PUBLISH_IP:-0.0.0.0}:8030:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      electric:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      s2:
        condition: service_started
    volumes:
      - shared_data:/home/node/shared
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      # 访问地址
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8030}
      LOGIN_ORIGIN: ${APP_ORIGIN:-http://localhost:8030}
      API_ORIGIN: ${APP_ORIGIN:-http://localhost:8030}

      # 数据库
      DATABASE_URL: postgresql://${POSTGRES_USER:-trigger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      DIRECT_URL: postgresql://${POSTGRES_USER:-trigger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"

      # 安全密钥
      SESSION_SECRET: ${SESSION_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:?请在 Dokploy .env 中设置强随机 MANAGED_WORKER_SECRET}

      # Electric
      ELECTRIC_ORIGIN: http://electric:3000

      # 日志
      APP_LOG_LEVEL: info

      # 内置对象存储
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY}
      OBJECT_STORE_BUCKET: packets
      OBJECT_STORE_REGION: us-east-1
      # dashboard Sessions 渲染（chat 快照/artifacts）使用独立桶
      ARTIFACTS_OBJECT_STORE_BUCKET: artifacts
      ARTIFACTS_OBJECT_STORE_BASE_URL: http://minio:9000

      # 内置镜像仓库
      DEPLOY_REGISTRY_HOST: ${REGISTRY_HOST:-localhost:5000}
      DEPLOY_REGISTRY_NAMESPACE: ${DEPLOY_REGISTRY_NAMESPACE:-trigger}
      DEPLOY_REGISTRY_USERNAME: ${REGISTRY_USERNAME:-registry-user}
      DEPLOY_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}

      # ClickHouse 日志存储
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse123}@clickhouse:8123?secure=false
      CLICKHOUSE_LOG_LEVEL: ${CLICKHOUSE_LOG_LEVEL:-info}

      # Run Replication（PG → ClickHouse）
      RUN_REPLICATION_ENABLED: ${RUN_REPLICATION_ENABLED:-1}
      RUN_REPLICATION_CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse123}@clickhouse:8123
      RUN_REPLICATION_LOG_LEVEL: ${RUN_REPLICATION_LOG_LEVEL:-info}

      # OTEL
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${DEV_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:8030/otel}

      # 优雅关闭
      GRACEFUL_SHUTDOWN_TIMEOUT: "1000"

      # Node 内存
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-}

      # Bootstrap（首次启动自动创建 worker group）
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: default
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token

      # 邮件（Magic Link 登录）
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      REPLY_TO_EMAIL: ${REPLY_TO_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # OAuth
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}

      # 访问控制
      WHITELISTED_EMAILS: ${WHITELISTED_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # 任务队列限制
      MAXIMUM_DEPLOYED_QUEUE_SIZE: ${MAXIMUM_DEPLOYED_QUEUE_SIZE:-30000}
      MAXIMUM_DEV_QUEUE_SIZE: ${MAXIMUM_DEV_QUEUE_SIZE:-100000}
      STREAMING_BATCH_MAX_ITEMS: ${STREAMING_BATCH_MAX_ITEMS:-3000}
      TASK_PAYLOAD_MAXIMUM_SIZE: ${TASK_PAYLOAD_MAXIMUM_SIZE:-10485760}

      # 版本锁定
      TRIGGER_IMAGE_TAG: ${TRIGGER_IMAGE_TAG:-v4.4.4}

      # 遥测
      TRIGGER_TELEMETRY_DISABLED: "1"

      # 内部 OTEL
      INTERNAL_OTEL_TRACE_LOGGING_ENABLED: ${INTERNAL_OTEL_TRACE_LOGGING_ENABLED:-0}

      # v2 = S2 流。v1 为 Redis-only 回退模式，Sessions/chat.agent 功能不可用
      REALTIME_STREAMS_DEFAULT_VERSION: ${REALTIME_STREAMS_DEFAULT_VERSION:-v2}

      # S2 实时流：webapp 与 s2 同在 trigger-net 内网，走容器名直连（不经外网），
      # 无需也不能使用 token（s2-lite 不支持鉴权，token 仅用于托管版 s2.dev）。
      # 若要强制 webapp 走外网地址，把 ENDPOINT 改为 https://<域名或IP:端口>/v1
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
      REALTIME_STREAMS_S2_ENDPOINT: ${REALTIME_STREAMS_S2_ENDPOINT:-http://s2/v1}
      REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS: "true"

  # ============================================================
  # Worker（Supervisor，任务调度执行）
  # ============================================================

  worker:
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.4.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks:
      - trigger-net
      - docker-proxy-net
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    depends_on:
      docker-proxy:
        condition: service_healthy
      webapp:
        condition: service_started
    volumes:
      - shared_data:/home/node/shared
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:?请在 Dokploy .env 中设置强随机 MANAGED_WORKER_SECRET}
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: worker
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      # 出队性能调优（16C16G）
      TRIGGER_DEQUEUE_MAX_RUN_COUNT: ${TRIGGER_DEQUEUE_MAX_RUN_COUNT:-50}
      TRIGGER_DEQUEUE_MAX_CONSUMER_COUNT: ${TRIGGER_DEQUEUE_MAX_CONSUMER_COUNT:-8}
      TRIGGER_DEQUEUE_INTERVAL_MS: ${TRIGGER_DEQUEUE_INTERVAL_MS:-100}
      TRIGGER_DEQUEUE_IDLE_INTERVAL_MS: ${TRIGGER_DEQUEUE_IDLE_INTERVAL_MS:-500}
      # 心跳（更快发现掉线）
      TRIGGER_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${TRIGGER_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      DEBUG: 1
      ENFORCE_MACHINE_PRESETS: 1
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: trigger-net
      DOCKER_REGISTRY_URL: ${REGISTRY_HOST:-}
      DOCKER_REGISTRY_USERNAME: ${REGISTRY_USERNAME:-registry-user}
      DOCKER_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: 0
      TRIGGER_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  
  s2-init:
    image: busybox:1.37
    restart: "no"
    environment:
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
    volumes:
      - s2-config:/config
    networks:
      - trigger-net

  s2:
    image: ${S2_IMAGE}
    restart: unless-stopped
    depends_on:
      s2-init:
        condition: service_completed_successfully
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    user: "0:0"
    # 安全说明：s2-lite 不支持 access token 鉴权（token 仅用于托管版 s2.dev），
    # 外网访问的安全只能靠网络层控制：
    #   1) 默认绑定 127.0.0.1（宿主机本机访问，不对公网开放）
    #   2) 需要外部访问时，将 S2_PUBLISH_IP 设为 0.0.0.0 并务必在防火墙/Dokploy 反代
    #      上做 IP 白名单 + TLS，切勿裸暴露到公网
    ports:
      - "${S2_PUBLISH_IP:-127.0.0.1}:${S2_PORT:-8090}:80"
    volumes:
      - s2-config:/config
      - s2:/data
    networks:
      - trigger-net